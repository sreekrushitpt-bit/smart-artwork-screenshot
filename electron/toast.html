<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', -apple-system, sans-serif;
        user-select: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      .card {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        background: rgba(17, 22, 34, 0.96);
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 13px 16px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
      }
      .icon {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        background: rgba(99, 102, 241, 0.22);
        color: #818cf8;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 13px;
        flex-shrink: 0;
        margin-top: 1px;
      }
      .title {
        color: #f8fafc;
        font-size: 13px;
        font-weight: 700;
      }
      .subtitle {
        color: #a5b4fc;
        font-size: 12px;
        font-weight: 600;
        margin-top: 2px;
      }
      .meta {
        color: #94a3b8;
        font-size: 11px;
        font-family: Consolas, monospace;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">✓</div>
      <div>
        <div id="title" class="title">✓ Artwork Captured</div>
        <div id="subtitle" class="subtitle">✓ Copied to Clipboard</div>
        <div id="meta" class="meta"></div>
      </div>
    </div>
    <script>
      if (window.electronToastAPI) {
        window.electronToastAPI.onUpdate((payload) => {
          document.getElementById('title').textContent = payload.title || '✓ Artwork Captured';
          document.getElementById('subtitle').textContent =
            payload.subtitle || '✓ Copied to Clipboard';
          const metaEl = document.getElementById('meta');
          metaEl.textContent = payload.meta || '';
          metaEl.style.display = payload.meta ? 'block' : 'none';
        });
      }
    </script>
  </body>
</html>
